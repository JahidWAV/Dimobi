const SUPABASE_URL='https://YOUR_PROJECT_REF.supabase.co';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';const CONFIGURED=!SUPABASE_URL.includes('YOUR_PROJECT_REF')&&!SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY');const sb=CONFIGURED?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;const DEFAULT=['Copyright, éditeur, ISBN, propriété intellectuelle','À propos de l’auteur','Épigraphe','Préface','Avant-propos','Remerciements','Chapitre 1','Postface','Auteur de la composition et mise en page'];let currentUser=null,state={projects:[],activeProject:null,activeSection:null},saveTimer,currentView='landing';const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),wc=t=>(t||'').trim()?(t||'').trim().split(/\s+/).length:0,project=()=>state.projects.find(x=>x.id===state.activeProject),section=()=>project()?.sections.find(x=>x.id===state.activeSection);const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"/></svg>',sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('dimobi.theme',t);const b=$('#themeButton'),l=t==='light';b.innerHTML=l?moon:sun;b.title=l?'Passer au thème sombre':'Passer au thème clair';b.setAttribute('aria-label',b.title);$('#themeColor').content=l?'#f7f7f5':'#090909'}function setPublicHeader(visible){$('#publicHeader').classList.toggle('hidden',!visible)}function updateNav(){const l=!!currentUser;$('#guestActions').classList.toggle('hidden',l);$('#userActions').classList.toggle('hidden',!l)}function landing(){currentView='landing';setPublicHeader(true);updateNav();$('#pageRoot').innerHTML=`<main><section class="hero"><div><div class="eyebrow"><i></i> Un espace pour les livres</div><h1>Écrivez le livre que vous <em>voulez</em> relire.</h1><p>DIMOBI réunit votre manuscrit, sa structure et sa mise en page dans un espace calme, conçu pour écrire sur la durée.</p><div class="hero-buttons"><button class="btn primary" id="heroStart">Commencer à écrire</button><a href="#features" class="btn">Découvrir DIMOBI</a></div><div class="hero-note">Vos textes restent liés à votre compte et synchronisés automatiquement.</div></div><div class="hero-preview"><div class="preview-window"><div class="preview-head"><i class="preview-dot"></i><i class="preview-dot"></i><i class="preview-dot"></i><span class="preview-title">DIMOBI — Manuscrit</span></div><div class="preview-body"><aside class="preview-side"><div class="preview-mini-logo">DIMOBI</div><div class="preview-mini-line active"></div><div class="preview-mini-line"></div><div class="preview-mini-line"></div><div class="preview-mini-line"></div></aside><article class="preview-editor"><div class="preview-context">Mon livre</div><h3>Chapitre 1</h3><div class="preview-rule"></div><div class="preview-text w90"></div><div class="preview-text w75"></div><div class="preview-text w84"></div><div class="preview-text w62"></div><div class="preview-text w90"></div></article></div></div><div class="preview-float"><div class="preview-float-label">Manuscrit</div><div class="preview-float-value">12 486 mots</div><div class="preview-float-note">Synchronisé à l’instant</div></div></div></section><section class="features" id="features"><div class="features-inner"><article class="feature"><span class="feature-index">01</span><h3>Écrire librement</h3><p>Une interface sans distraction, pensée pour laisser toute la place à votre texte.</p></article><article class="feature"><span class="feature-index">02</span><h3>Garder le fil</h3><p>Structurez chaque livre en chapitres, préface, remerciements et sections sur mesure.</p></article><article class="feature"><span class="feature-index">03</span><h3>Publier proprement</h3><p>Préparez votre manuscrit pour l’impression et l’export PDF.</p></article></div></section><section class="workflow"><div class="section-kicker">Un flux simple</div><div class="workflow-grid"><h2>Du premier mot<br>à la dernière page.</h2><div class="workflow-copy"><p>DIMOBI vous accompagne sans imposer de méthode. Créez un projet, posez sa structure, puis avancez chapitre après chapitre.</p><p>Votre travail est enregistré dans votre compte : retrouvez-le lorsque vous le souhaitez, depuis n’importe quel navigateur.</p><ul class="workflow-list"><li><span>01</span>Créez un projet pour chaque livre</li><li><span>02</span>Organisez votre manuscrit</li><li><span>03</span>Écrivez et exportez en PDF</li></ul></div></div></section><section class="landing-cta"><h2>Votre prochain chapitre<br>peut commencer maintenant.</h2><p>Créez votre compte gratuitement et démarrez votre manuscrit dans quelques secondes.</p><button id="ctaStart" class="btn primary">Créer un compte</button></section><footer class="landing-footer"><span>DIMOBI</span><span>Un espace pour écrire.</span></footer></main>`;$('#heroStart').onclick=()=>currentUser?dashboard():auth('signup');$('#ctaStart').onclick=()=>auth('signup')}function auth(mode='login'){currentView='auth';setPublicHeader(true);updateNav();const signup=mode==='signup';$('#pageRoot').innerHTML=`<main class="auth-page"><section class="auth-card"><div class="brand" style="margin-bottom:29px">DIMOBI</div><h1>${signup?'Créer un compte':'Bon retour'}</h1><p>${signup?'Créez votre compte pour sauvegarder et retrouver vos manuscrits partout.':'Connectez-vous pour retrouver vos projets et continuer à écrire.'}</p><form id="authForm"><div class="auth-field"><label class="field-label" for="authEmail">Adresse e-mail</label><input class="auth-input" id="authEmail" type="email" required placeholder="vous@exemple.com"></div><div class="auth-field"><label class="field-label" for="authPassword">Mot de passe</label><input class="auth-input" id="authPassword" type="password" minlength="8" required placeholder="8 caractères minimum"></div><button class="auth-submit" id="authSubmit" type="submit">${signup?'Créer mon compte':'Se connecter'}</button></form><div class="auth-message" id="authMessage"></div><div class="auth-switch">${signup?'Déjà un compte ?':'Pas encore de compte ?'} <button id="authSwitch">${signup?'Se connecter':'Créer un compte'}</button></div>${!CONFIGURED?'<div class="auth-config">Configuration requise : ajoute ton URL Supabase et ta clé anon dans le fichier avant de déployer.</div>':''}</section></main>`;$('#authSwitch').onclick=()=>auth(signup?'login':'signup');$('#authForm').onsubmit=e=>handleAuth(e,signup)}async function handleAuth(e,signup){e.preventDefault();const m=$('#authMessage'),b=$('#authSubmit'),email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!CONFIGURED){m.textContent='Supabase n’est pas encore configuré dans ce fichier.';return}b.disabled=true;const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});b.disabled=false;if(r.error){m.textContent=r.error.message;return}if(signup&&!r.data.session){m.className='auth-message success';m.textContent='Compte créé. Vérifiez votre e-mail puis connectez-vous.';return}currentUser=r.data.user;await loadProjects();dashboard()}async function loadProjects(){const r=await sb.from('projects').select('id,name,sections(id,title,content,position)').order('updated_at',{ascending:false});if(r.error){alert(r.error.message);return}state.projects=(r.data||[]).map(p=>({...p,sections:(p.sections||[]).sort((a,b)=>a.position-b.position)}));state.activeProject=state.projects[0]?.id||null;state.activeSection=state.projects[0]?.sections[0]?.id||null}async function createProject(name){const r=await sb.from('projects').insert({user_id:currentUser.id,name:name.trim()||'Sans titre'}).select().single();if(r.error){alert(r.error.message);return}const q=await sb.from('sections').insert(DEFAULT.map((title,position)=>({project_id:r.data.id,title,content:'',position}))).select();if(q.error){alert(q.error.message);return}r.data.sections=(q.data||[]).sort((a,b)=>a.position-b.position);state.projects.unshift(r.data);state.activeProject=r.data.id;state.activeSection=r.data.sections[6]?.id||r.data.sections[0]?.id;renderDashboard()}async function createSection(name){const p=project();if(!p)return;const r=await sb.from('sections').insert({project_id:p.id,title:name.trim()||'Nouvelle section',content:'',position:p.sections.length}).select().single();if(r.error){alert(r.error.message);return}p.sections.push(r.data);state.activeSection=r.data.id;renderDashboard()}function dashboard(){currentView='dashboard';setPublicHeader(false);$('#pageRoot').innerHTML=`<main class="dashboard"><div class="dashboard-nav"><div class="dashboard-brand">DIMOBI</div><select id="projectPicker" class="project-select"></select><div class="dash-actions"><button id="newProject" class="btn">Nouveau projet</button><details class="account-menu"><summary class="account-button">${esc(currentUser.email||'Compte')}</summary><div class="account-popover"><div class="account-email">${esc(currentUser.email||'')}</div><button id="signOut">Déconnexion</button></div></details></div></div><div class="dash-content"><aside class="outline"><div class="outline-head"><span class="outline-label">Manuscrit</span><button id="addSection" class="outline-add">+</button></div><div id="sections"></div></aside><section id="editorRoot" class="editor-space"></section></div></main>`;renderDashboard();$('#newProject').onclick=showProject;$('#addSection').onclick=showSection;$('#projectPicker').onchange=e=>{state.activeProject=e.target.value;state.activeSection=project()?.sections[0]?.id||null;renderDashboard()};$('#signOut').onclick=async()=>{await sb.auth.signOut();currentUser=null;state={projects:[],activeProject:null,activeSection:null};landing()}}function renderDashboard(){const picker=$('#projectPicker'),list=$('#sections'),root=$('#editorRoot');picker.innerHTML=state.projects.length?state.projects.map(p=>`<option value="${p.id}" ${p.id===state.activeProject?'selected':''}>${esc(p.name)}</option>`).join(''):'<option>Aucun projet</option>';const p=project(),s=section();if(!p||!s){list.innerHTML='';root.innerHTML=`<div class="dashboard-empty"><div><h1>Commencez votre livre.</h1><p>Créez un premier projet pour ouvrir votre espace d’écriture.</p><button id="emptyProject" class="btn primary">Nouveau projet</button></div></div>`;$('#emptyProject').onclick=showProject;return}list.innerHTML=p.sections.map((s,i)=>`<button class="outline-item ${s.id===state.activeSection?'active':''}" data-id="${s.id}"><span class="outline-index">${i+1}</span><span class="outline-name">${esc(s.title)}</span><span class="outline-words">${wc(s.content)}</span></button>`).join('');list.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>{state.activeSection=n.dataset.id;renderDashboard()});const total=p.sections.reduce((n,x)=>n+wc(x.content),0),chars=p.sections.reduce((n,x)=>n+x.content.length,0);root.innerHTML=`<header class="editor-top"><span>${esc(p.name)} / ${esc(s.title)}</span><div class="editor-top-actions"><span id="syncState" class="sync-state"><i class="sync-dot"></i>Synchronisé</span><button id="printCurrent" class="top-button">Imprimer</button></div></header><article class="editor"><input id="sectionTitle" class="section-title" value="${esc(s.title)}" placeholder="Titre de la section"><div class="editor-rule"></div><textarea id="sectionContent" class="writing-area" placeholder="Commencez à écrire…">${esc(s.content)}</textarea></article><footer class="dash-status"><span>Sections <b>${p.sections.length}</b></span><span>Mots <b id="words">${wc(s.content)} / ${total}</b></span><span>Caractères <b id="chars">${s.content.length} / ${chars}</b></span></footer>`;$('#sectionTitle').oninput=e=>updateSection('title',e.target.value);$('#sectionContent').oninput=e=>updateSection('content',e.target.value);$('#printCurrent').onclick=()=>window.print()}function updateSection(key,value){const s=section(),p=project();s[key]=value;if(key==='title'){const n=$(`[data-id="${s.id}"] .outline-name`);if(n)n.textContent=value||'Sans titre'}else{const total=p.sections.reduce((n,x)=>n+wc(x.content),0),chars=p.sections.reduce((n,x)=>n+x.content.length,0);$('#words').textContent=`${wc(value)} / ${total}`;$('#chars').textContent=`${value.length} / ${chars}`;const n=$(`[data-id="${s.id}"] .outline-words`);if(n)n.textContent=wc(value)}const sync=$('#syncState');sync?.classList.add('saving');if(sync)sync.lastChild.textContent='Enregistrement…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const r=await sb.from('sections').update({[key]:value}).eq('id',s.id);sync?.classList.remove('saving');if(sync)sync.lastChild.textContent=r.error?'Erreur de synchronisation':'Synchronisé'},450)}function showProject(){$('#projectDialog').showModal();setTimeout(()=>$('#projectName').focus(),0)}function showSection(){if(!project()){showProject();return}$('#sectionDialog').showModal();setTimeout(()=>$('#sectionName').focus(),0)}$('#themeButton').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');$('#brandLink').onclick=e=>{e.preventDefault();landing()};$('#loginButton').onclick=()=>auth('login');$('#signupButton').onclick=()=>auth('signup');$('#openAppButton').onclick=dashboard;$('#cancelProject').onclick=()=>$('#projectDialog').close();$('#cancelSection').onclick=()=>$('#sectionDialog').close();$('#projectForm').onsubmit=async e=>{e.preventDefault();await createProject($('#projectName').value);$('#projectName').value='';$('#projectDialog').close()};$('#sectionForm').onsubmit=async e=>{e.preventDefault();await createSection($('#sectionName').value);$('#sectionName').value='';$('#sectionDialog').close()};async function boot(){setTheme(localStorage.getItem('dimobi.theme')||'dark');if(CONFIGURED){const {data:{session}}=await sb.auth.getSession();if(session)currentUser=session.user;sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){currentUser=null;landing()}})}landing();if(currentUser)dashboard()}boot();
</script>
